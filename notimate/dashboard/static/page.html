<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>NotiMate — панель владельца</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#16352e;--muted:#64756f;--line:#e2e8e5;--brand:#1b6b57;--brand-ink:#fff;--rev:#1b8a6b;--exp:#d0603f;--warn:#b7791f;--bad:#c0392b;--chip:#e8f0ed;--shadow:0 1px 2px rgba(22,53,46,.06),0 4px 14px rgba(22,53,46,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a17;--card:#16241f;--ink:#e7f0ec;--muted:#93a8a0;--line:#25382f;--brand:#3fb28f;--brand-ink:#08130f;--rev:#3fb28f;--exp:#e78667;--warn:#e0b04d;--bad:#ef7b6d;--chip:#1f332b;--shadow:none}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0;letter-spacing:-.2px}h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 10px;font:600 12px inherit;border:0;text-decoration:none}
button.chip,a.chip{cursor:pointer}
.tabs{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px inherit;padding:8px 16px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);grid-column:span 12;min-width:0}
@media(min-width:760px){.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px;font-weight:700}
.kpi{font-size:28px;font-weight:750;letter-spacing:-.5px;line-height:1.1}.kpi small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:6px;letter-spacing:0}
.pos{color:var(--rev)}.neg{color:var(--bad)}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--chip)}
.bar span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.cat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 6px;border-radius:10px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.cat:hover,.cat[aria-pressed=true]{background:var(--chip)}
.cat b{font-weight:650}.cat .track{grid-column:1/-1;height:6px;border-radius:99px;background:var(--chip);overflow:hidden}.cat[aria-pressed=true] .track,.cat:hover .track{background:var(--card)}
.cat .track i{display:block;height:100%;background:var(--exp);border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}.tag{font-size:11px;background:var(--chip);border-radius:6px;padding:2px 7px;color:var(--muted);white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
input[type=search]{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
ul.plain{list-style:none;margin:0;padding:0}ul.plain li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}ul.plain li:last-child{border-bottom:0}
.muted{color:var(--muted)}.empty{color:var(--muted);padding:6px 0}
.notice{max-width:520px;margin:12vh auto;text-align:center}.notice h1{font-size:22px;margin-bottom:8px}
.btn{display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:9px 14px;text-decoration:none;border:0;cursor:pointer;font:650 15px inherit}
svg text{fill:var(--muted);font:11px sans-serif}
footer{margin:18px 0 6px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="notice"><h1>NotiMate</h1><p class="muted">Загружаю данные…</p></div></div>
<script src="/dashboard/app.js" defer></script>
</body>
</html>
